# Server: copy this file + Caddyfile + a .env next to it (see docs/deploy-env.md).
# DOCKER_IMAGE must match your GHCR image (lowercase).
# (Compose v2+ — no top-level `version` key; it is obsolete.)
services:
  app:
    image: ${DOCKER_IMAGE:-streamy:latest}
    expose:
      - "3000"
    restart: always
    env_file: .env
    environment:
      - NODE_ENV=production
      # Migrations on startup (idempotent). Set RUN_MIGRATE=0 only if you run migrate separately.
      - RUN_MIGRATE=${RUN_MIGRATE:-1}
      # SQLite path inside container; volume streamy-data is mounted at /app/data
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/prod.db}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      # Same as trustHost: true (not on NextAuthOptions type in next-auth v4 typings)
      - AUTH_TRUST_HOST=true
    volumes:
      - streamy-data:/app/data

  # Continuous SQLite backup to S3 (see litestream.yml for the why).
  #
  # Shares the same volume the app writes -- NOT read-only. Confirmed directly
  # (litestream refused to start against a :ro mount, "attempt to write a
  # readonly database"): it maintains its own tracking table inside the
  # database file to detect changes, not just passive WAL copying. It never
  # touches the app's own tables, and SQLite's WAL mode is built for exactly
  # this concurrent-access pattern, so it doesn't block the app either way.
  #
  # NOT `restart: always`, following the same hard-won rule as gluetun below: a
  # container that cannot start must not be able to crash-loop this small
  # instance into the ground. Litestream retries S3 failures internally rather
  # than exiting, so the only thing that makes it exit is a genuine misconfig --
  # exactly the case where stopping after a few tries is the right answer. If it
  # is not running, the site is unaffected and backups are simply stale, which
  # the restore drill in docs/backup-restore.md is meant to catch.
  litestream:
    image: litestream/litestream:0.3
    restart: on-failure:5
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY}
      - LITESTREAM_BUCKET=${LITESTREAM_BUCKET}
    volumes:
      - streamy-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: replicate
    depends_on:
      - app

  # VPN egress for the tour watcher, so its requests exit from the VPN
  # provider's IP rather than this box's -- which DNS ties to the site and its
  # owner. Only the watcher's traffic uses this; the public site keeps serving
  # on the box's real IP, because a public site cannot live behind a commercial
  # VPN (no stable inbound). Whole-box VPN would gain nothing here and would put
  # authenticated GitHub/AWS/TMDB traffic through the tunnel for no benefit.
  #
  # Gated behind a compose profile so it only starts when explicitly enabled
  # (`docker compose --profile vpn up -d`). Without VPN credentials set, this
  # service simply does not run, and it can never take the site down with it.
  # gluetun exposes an HTTP proxy on :8888; the app reaches it as
  # PAGE_WATCH_PROXY_URL=http://gluetun:8888, and PAGE_WATCH_REQUIRE_PROXY=1
  # makes the watcher fail closed if the tunnel drops.
  #
  # VPN_* come from the server .env. gluetun supports many providers; the vars
  # here are the WireGuard shape (see gluetun's wiki for a given provider).
  gluetun:
    image: qmcgaw/gluetun:latest
    profiles: ["vpn"]
    # NOT restart: always. A VPN that can't connect must not be able to take the
    # whole box down: with "always", a failing gluetun crash-loops forever, and
    # on a small instance that exhausts CPU/disk until even sshd is refused --
    # which is exactly what happened. on-failure with a cap means it tries a few
    # times and then stays stopped, leaving the box healthy and the watcher
    # failing closed (safe) until someone looks.
    restart: on-failure:5
    # Hard ceilings so even while it is trying, it cannot starve the app.
    mem_limit: 128m
    cpus: 0.5
    # Cap the logs too; a crash loop otherwise fills the disk with them.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      # Two ways providers authenticate, and gluetun accepts whichever is set:
      #  - credential providers (PIA, NordVPN, ...): OPENVPN_USER/PASSWORD, from
      #    which gluetun generates the WireGuard key itself. This is PIA's path
      #    -- there is no WireGuard config to download; it's your account login.
      #  - config providers (Mullvad, Proton, ...): a WIREGUARD_PRIVATE_KEY and
      #    ADDRESSES taken from a downloaded .conf.
      # Unused ones stay blank and gluetun ignores them.
      - OPENVPN_USER=${OPENVPN_USER:-}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}
      # PIA selects exits by region; most others by country. Set whichever your
      # provider uses, or leave both blank for its default.
      - SERVER_REGIONS=${VPN_SERVER_REGIONS:-}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-}
      # Turn on gluetun's built-in HTTP proxy, bound inside the compose network.
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      # gluetun's own kill switch: if the tunnel is down, nothing leaves. This
      # is belt-and-braces with the app's PAGE_WATCH_REQUIRE_PROXY.
      - FIREWALL=on
    expose:
      - "8888"

  # Reverse proxy: terminates TLS and auto-provisions/renews a Let's Encrypt
  # cert for the domain in ./Caddyfile. Zero manual cert management.
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      # Host-mounted (not a named volume) so the CloudWatch agent on the
      # host can tail this file directly for shipping access logs.
      - ./logs:/var/log/caddy

volumes:
  streamy-data:
  caddy-data:
  caddy-config:
