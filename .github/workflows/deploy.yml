# Auto-deploy on push to main: build image, push to GHCR, write .env from Actions secrets, pull + up on server.
# Secrets DATABASE_URL, TMDB_API_KEY, NEXTAUTH_SECRET, NEXTAUTH_URL, ADMIN_NAME,
# RADARR_URL, RADARR_API_KEY, SONARR_URL, SONARR_API_KEY, MEDIA_WEBHOOK_SECRET,
# JELLYFIN_URL, JELLYFIN_API_KEY must be set in the repo — they sync to the server each deploy.
#
# Adding a new one takes THREE edits below, not one: the deploy step's `env:`
# block, the `envs:` list (appleboy/ssh-action only forwards what's named
# there), and the `printf` that writes .env. Miss any and the variable silently
# arrives empty -- the app just reports that integration as unconfigured, with
# nothing in the logs to say why. This .env is rewritten from scratch on every
# deploy, so editing it by hand on the server (or `export`ing in an SSH shell,
# which the container never sees anyway) does not survive.
name: Build and Deploy

on:
  push:
    branches: [main]
    # Don't rebuild and redeploy the app for changes that don't affect it --
    # infrastructure code, docs, and the infra scripts. Saves a slow ~1.3GB
    # image pull on the server for a README edit.
    paths-ignore:
      - "infra/**"
      - "**.md"
  workflow_dispatch:  # Run manually from Actions tab

# One deploy at a time. Merging two PRs seconds apart triggered two overlapping
# deploys, and two ~1.3GB image pulls at once thrashed the small instance into a
# lock-up. Queue deploys instead of running them concurrently; don't cancel a
# deploy already touching the server mid-way, which could leave it half-updated.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Gate: nothing is built or deployed unless the unit tests pass. Pure logic
  # only, no DOM or network, so this stays a few seconds rather than becoming
  # a reason to skip CI.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Skips postinstall (prisma generate) -- the unit tests are pure and
        # don't touch the database, so generating the client would only add time.
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

  # Deliberately NOT `needs: test` -- the image build is the long pole (~3min
  # against the test job's ~25s), so gating it behind the tests just adds that
  # 25s to every deploy's critical path. Running them side by side is still
  # safe because `deploy` below needs *both*: a failing test never reaches the
  # server. The one tradeoff is that a failed run can leave GHCR's `latest`
  # pointing at an image that was built but never validated -- nothing pulls it
  # automatically (the server only pulls during a gated deploy), but a manual
  # `docker compose pull` on the box would pick it up, so check the run status
  # before doing that by hand.
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=max exports every intermediate layer of every stage, not just
          # what the final image needs -- for a straightforward two-stage
          # builder->runner Dockerfile like this one (a direct COPY --from
          # chain, no throwaway stages), that meant re-uploading the entire
          # builder stage's node_modules layer (700MB+) to the GHA cache
          # backend on nearly every build regardless of whether its content
          # had actually changed. Confirmed live: "sending cache export" and
          # several individual "writing layer" steps together accounted for
          # 70-95s of a ~100-140s build -- most of the job. mode=min still
          # caches every layer that's genuinely an ancestor of the final
          # image (which is all of them here, since node_modules/.prisma,
          # @prisma, and prisma are subdirectories of that same builder
          # layer) -- it only stops re-exporting the extra per-stage cache
          # manifests mode=max adds on top, which is where the actual growth
          # was coming from.
          cache-to: type=gha,mode=min
          # Middleware (Edge) bakes NEXTAUTH_* at build — must match runtime .env or sessions break.
          build-args: |
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}

  deploy:
    # Both, so the tests still gate what actually reaches the server even
    # though they no longer gate the build (see build-and-push above).
    needs: [test, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml and Caddyfile to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,Caddyfile,litestream.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          RADARR_URL: ${{ secrets.RADARR_URL }}
          RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
          RADARR_ROOT_FOLDER: ${{ secrets.RADARR_ROOT_FOLDER }}
          RADARR_QUALITY_PROFILE_ID: ${{ secrets.RADARR_QUALITY_PROFILE_ID }}
          SONARR_URL: ${{ secrets.SONARR_URL }}
          SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
          SONARR_ROOT_FOLDER: ${{ secrets.SONARR_ROOT_FOLDER }}
          SONARR_QUALITY_PROFILE_ID: ${{ secrets.SONARR_QUALITY_PROFILE_ID }}
          # Indexer manager. Optional: the Services panel reports Prowlarr as
          # unconfigured when either of these is unset.
          PROWLARR_URL: ${{ secrets.PROWLARR_URL }}
          PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
          # Free GeoLite2 key for the visitor map. Optional: the map reports
          # itself unconfigured when unset. The database is downloaded on first
          # use and cached on the data volume, so no IP is ever sent out to be
          # located.
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          # Shared secret for the tour-watch cron endpoint. That endpoint fails
          # closed, so leaving this unset disables page watching entirely.
          PAGE_WATCH_SECRET: ${{ secrets.PAGE_WATCH_SECRET }}
          # Download -> playback end-to-end check (see playback-check.yml /
          # src/lib/playbackCheck.ts). Endpoint fails closed when unset.
          PLAYBACK_CHECK_SECRET: ${{ secrets.PLAYBACK_CHECK_SECRET }}
          # Shared secret for the games-artwork auto-fill cron endpoint. Same
          # fail-closed rule: unset means every request is rejected.
          GAMES_ARTWORK_CRON_SECRET: ${{ secrets.GAMES_ARTWORK_CRON_SECRET }}
          # Anonymising egress for the tour watcher. PAGE_WATCH_PROXY_URL points
          # at the gluetun sidecar's HTTP proxy; PAGE_WATCH_REQUIRE_PROXY=1 makes
          # a watch fetch fail closed rather than leave from this box's real IP.
          # PAGE_WATCH_USER_AGENT overrides the (deliberately anonymous) default.
          PAGE_WATCH_PROXY_URL: ${{ secrets.PAGE_WATCH_PROXY_URL }}
          PAGE_WATCH_REQUIRE_PROXY: ${{ secrets.PAGE_WATCH_REQUIRE_PROXY }}
          # Continuous SQLite backup to S3 (see litestream.yml). Scoped to one
          # bucket; the site runs unaffected if they are unset, just unbacked-up.
          LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_ACCESS_KEY_ID }}
          LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_SECRET_ACCESS_KEY }}
          LITESTREAM_BUCKET: ${{ secrets.LITESTREAM_BUCKET }}
          PAGE_WATCH_USER_AGENT: ${{ secrets.PAGE_WATCH_USER_AGENT }}
          # VPN credentials for the gluetun sidecar. When VPN_SERVICE_PROVIDER is
          # set, the deploy enables the "vpn" compose profile and gluetun starts;
          # unset, the sidecar never runs and egress stays direct.
          # Master switch for the gluetun sidecar. Must be exactly "true" for it
          # to start; anything else (including unset) keeps it off.
          VPN_ENABLED: ${{ secrets.VPN_ENABLED }}
          VPN_SERVICE_PROVIDER: ${{ secrets.VPN_SERVICE_PROVIDER }}
          VPN_TYPE: ${{ secrets.VPN_TYPE }}
          # Credential auth (PIA, Nord): gluetun makes the WireGuard key from these.
          OPENVPN_USER: ${{ secrets.OPENVPN_USER }}
          OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
          # Config auth (Mullvad, Proton): a downloaded WireGuard key instead.
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          WIREGUARD_ADDRESSES: ${{ secrets.WIREGUARD_ADDRESSES }}
          VPN_SERVER_REGIONS: ${{ secrets.VPN_SERVER_REGIONS }}
          VPN_SERVER_COUNTRIES: ${{ secrets.VPN_SERVER_COUNTRIES }}
          MEDIA_WEBHOOK_SECRET: ${{ secrets.MEDIA_WEBHOOK_SECRET }}
          JELLYFIN_URL: ${{ secrets.JELLYFIN_URL }}
          JELLYFIN_API_KEY: ${{ secrets.JELLYFIN_API_KEY }}
          # Jellyfin user id to sync watch progress with (the household's
          # Roku app login). Optional: unset just skips sync.
          JELLYFIN_USER_ID: ${{ secrets.JELLYFIN_USER_ID }}
          QBITTORRENT_URL: ${{ secrets.QBITTORRENT_URL }}
          QBITTORRENT_USER: ${{ secrets.QBITTORRENT_USER }}
          QBITTORRENT_PASSWORD: ${{ secrets.QBITTORRENT_PASSWORD }}
          # gamarr (games/ROMs) on mediabox, reachable over Tailscale. Optional:
          # the admin Games panel reports itself unconfigured when unset.
          GAMARR_URL: ${{ secrets.GAMARR_URL }}
          # gamarr now requires this on every API call (added 2026-09-04,
          # once gamarr's own auth was turned on -- see mediabox-infra's
          # docker-compose.yml). Optional here too: unset just means gamarr
          # has no auth configured and every call goes out with no key.
          GAMARR_API_KEY: ${{ secrets.GAMARR_API_KEY }}
          # SteamGridDB key for that panel's artwork picker only. Optional:
          # the picker hides itself when unset, and the Deck's own steam_sync.py
          # keeps auto-fetching art with its own separately-held key.
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          ALERT_SNS_TOPIC_ARN: ${{ secrets.ALERT_SNS_TOPIC_ARN }}
          ALERT_AWS_ACCESS_KEY_ID: ${{ secrets.ALERT_AWS_ACCESS_KEY_ID }}
          ALERT_AWS_SECRET_ACCESS_KEY: ${{ secrets.ALERT_AWS_SECRET_ACCESS_KEY }}
          # Admin health check: MTD AWS spend ceiling. Reuses the same
          # credential above (needs ce:GetCostAndUsage added to it). Optional.
          AWS_COST_ALERT_THRESHOLD_USD: ${{ secrets.AWS_COST_ALERT_THRESHOLD_USD }}
          # Reachable from this box over Tailscale. Optional: the admin chat
          # panel reports itself as unconfigured when this is unset.
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          # Self-hosted SearXNG on mediabox. Optional: the chat panel hides the
          # search toggle when unset rather than offering a switch that fails.
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          # Public address to probe for exposed internal services. Set this to
          # the HOME network's public IP -- probing this box's own address only
          # proves these ports aren't open here, which they never were.
          PUBLIC_PROBE_HOST: ${{ secrets.PUBLIC_PROBE_HOST }}
          # Global IPv6 address of the home server. Checked separately: there
          # is no NAT in front of IPv6, so a clean IPv4 result proves nothing.
          PUBLIC_PROBE_HOST_V6: ${{ secrets.PUBLIC_PROBE_HOST_V6 }}
          # Fine-grained PAT scoped to the website repo, with BOTH
          # contents:write (branch + commit) and pull_requests:write (open +
          # merge the PR). Publishing goes through a PR, so a contents-only
          # token gets as far as the commit and then fails.
          # Blog publishing is disabled when unset.
          #
          # The secrets are named BLOG_GITHUB_* while the env vars stay
          # GITHUB_BLOG_*. That mismatch is deliberate and load-bearing:
          # GitHub rejects any Actions secret whose name starts with GITHUB_
          # (reserved prefix, HTTP 422). Referencing secrets.GITHUB_BLOG_TOKEN
          # is not an error at run time -- it silently expands to empty, so
          # publishing would report itself unconfigured forever with nothing
          # in the logs to explain why. Only the secret name may change here;
          # the env var name is what the app reads.
          GITHUB_BLOG_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
          GITHUB_BLOG_REPO: ${{ secrets.BLOG_GITHUB_REPO }}
          GITHUB_BLOG_BRANCH: ${{ secrets.BLOG_GITHUB_BRANCH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The default command timeout is 10m. On this small instance, pulling
          # and extracting the ~1.3GB image can run past that, and a timeout mid-
          # extraction leaves the box thrashing -- which is exactly how a deploy
          # took the site down. 20m gives a slow pull room to finish.
          command_timeout: 20m
          envs: DATABASE_URL,TMDB_API_KEY,NEXTAUTH_SECRET,NEXTAUTH_URL,ADMIN_NAME,RADARR_URL,RADARR_API_KEY,RADARR_ROOT_FOLDER,RADARR_QUALITY_PROFILE_ID,SONARR_URL,SONARR_API_KEY,SONARR_ROOT_FOLDER,SONARR_QUALITY_PROFILE_ID,PROWLARR_URL,PROWLARR_API_KEY,MAXMIND_LICENSE_KEY,PAGE_WATCH_SECRET,PAGE_WATCH_PROXY_URL,PAGE_WATCH_REQUIRE_PROXY,PAGE_WATCH_USER_AGENT,VPN_ENABLED,VPN_SERVICE_PROVIDER,VPN_TYPE,OPENVPN_USER,OPENVPN_PASSWORD,WIREGUARD_PRIVATE_KEY,WIREGUARD_ADDRESSES,VPN_SERVER_REGIONS,VPN_SERVER_COUNTRIES,MEDIA_WEBHOOK_SECRET,JELLYFIN_URL,JELLYFIN_API_KEY,JELLYFIN_USER_ID,QBITTORRENT_URL,QBITTORRENT_USER,QBITTORRENT_PASSWORD,GAMARR_URL,GAMARR_API_KEY,SGDB_API_KEY,ALERT_SNS_TOPIC_ARN,ALERT_AWS_ACCESS_KEY_ID,ALERT_AWS_SECRET_ACCESS_KEY,AWS_COST_ALERT_THRESHOLD_USD,OLLAMA_URL,OLLAMA_MODEL,SEARXNG_URL,PUBLIC_PROBE_HOST,PUBLIC_PROBE_HOST_V6,GITHUB_BLOG_TOKEN,GITHUB_BLOG_REPO,GITHUB_BLOG_BRANCH,LITESTREAM_ACCESS_KEY_ID,LITESTREAM_SECRET_ACCESS_KEY,LITESTREAM_BUCKET,PLAYBACK_CHECK_SECRET,GAMES_ARTWORK_CRON_SECRET
          script: |
            set -e
            # docker-compose-plugin is only in Docker's apt repo on many systems; fallback = official v2 binary
            install_compose_v2_binary() {
              ARCH=$(uname -m)
              case "$ARCH" in
                x86_64) CARCH="x86_64" ;;
                aarch64|arm64) CARCH="aarch64" ;;
                *) echo "ERROR: Unsupported arch for Compose binary: $ARCH"; exit 1 ;;
              esac
              COMPOSE_VER="v2.32.2"
              echo "Installing Docker Compose ${COMPOSE_VER} CLI plugin from GitHub..."
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VER}/docker-compose-linux-${CARCH}" -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            }
            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose v2 not found — trying apt/yum, then GitHub binary..."
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update -qq
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker-compose-plugin || true
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y docker-compose-plugin || true
              fi
            fi
            if ! docker compose version >/dev/null 2>&1; then
              install_compose_v2_binary
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "ERROR: docker compose still unavailable."
              exit 1
            fi
            cd ${{ secrets.DEPLOY_PATH }}
            export DOCKER_IMAGE=$(echo "${{ env.REGISTRY }}/${{ github.repository }}:latest" | tr '[:upper:]' '[:lower:]')
            umask 077
            printf '%s\n' \
              "DOCKER_IMAGE=${DOCKER_IMAGE}" \
              "DATABASE_URL=${DATABASE_URL}" \
              "TMDB_API_KEY=${TMDB_API_KEY}" \
              "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}" \
              "NEXTAUTH_URL=${NEXTAUTH_URL}" \
              "ADMIN_NAME=${ADMIN_NAME}" \
              "RADARR_URL=${RADARR_URL}" \
              "RADARR_API_KEY=${RADARR_API_KEY}" \
              "RADARR_ROOT_FOLDER=${RADARR_ROOT_FOLDER}" \
              "RADARR_QUALITY_PROFILE_ID=${RADARR_QUALITY_PROFILE_ID}" \
              "SONARR_URL=${SONARR_URL}" \
              "SONARR_API_KEY=${SONARR_API_KEY}" \
              "SONARR_ROOT_FOLDER=${SONARR_ROOT_FOLDER}" \
              "SONARR_QUALITY_PROFILE_ID=${SONARR_QUALITY_PROFILE_ID}" \
              "PROWLARR_URL=${PROWLARR_URL}" \
              "PROWLARR_API_KEY=${PROWLARR_API_KEY}" \
              "MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY}" \
              "PAGE_WATCH_SECRET=${PAGE_WATCH_SECRET}" \
              "PAGE_WATCH_PROXY_URL=${PAGE_WATCH_PROXY_URL}" \
              "PAGE_WATCH_REQUIRE_PROXY=${PAGE_WATCH_REQUIRE_PROXY}" \
              "PAGE_WATCH_USER_AGENT=${PAGE_WATCH_USER_AGENT}" \
              "LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID}" \
              "LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY}" \
              "LITESTREAM_BUCKET=${LITESTREAM_BUCKET}" \
              "PLAYBACK_CHECK_SECRET=${PLAYBACK_CHECK_SECRET}" \
              "GAMES_ARTWORK_CRON_SECRET=${GAMES_ARTWORK_CRON_SECRET}" \
              "VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}" \
              "VPN_TYPE=${VPN_TYPE}" \
              "OPENVPN_USER=${OPENVPN_USER}" \
              "OPENVPN_PASSWORD=${OPENVPN_PASSWORD}" \
              "WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}" \
              "WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}" \
              "VPN_SERVER_REGIONS=${VPN_SERVER_REGIONS}" \
              "VPN_SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}" \
              "MEDIA_WEBHOOK_SECRET=${MEDIA_WEBHOOK_SECRET}" \
              "AUTH_TRUST_HOST=true" \
              "RUN_MIGRATE=1" \
              "JELLYFIN_URL=${JELLYFIN_URL}" \
              "JELLYFIN_API_KEY=${JELLYFIN_API_KEY}" \
              "JELLYFIN_USER_ID=${JELLYFIN_USER_ID}" \
              "QBITTORRENT_URL=${QBITTORRENT_URL}" \
              "QBITTORRENT_USER=${QBITTORRENT_USER}" \
              "QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}" \
              "GAMARR_URL=${GAMARR_URL}" \
              "GAMARR_API_KEY=${GAMARR_API_KEY}" \
              "SGDB_API_KEY=${SGDB_API_KEY}" \
              "OLLAMA_URL=${OLLAMA_URL}" \
              "OLLAMA_MODEL=${OLLAMA_MODEL}" \
              "SEARXNG_URL=${SEARXNG_URL}" \
              "PUBLIC_PROBE_HOST=${PUBLIC_PROBE_HOST}" \
              "PUBLIC_PROBE_HOST_V6=${PUBLIC_PROBE_HOST_V6}" \
              "GITHUB_BLOG_TOKEN=${GITHUB_BLOG_TOKEN}" \
              "GITHUB_BLOG_REPO=${GITHUB_BLOG_REPO}" \
              "GITHUB_BLOG_BRANCH=${GITHUB_BLOG_BRANCH}" \
              "ALERT_SNS_TOPIC_ARN=${ALERT_SNS_TOPIC_ARN}" \
              "ALERT_PROJECT=streamy" \
              "AWS_REGION=us-east-1" \
              "AWS_ACCESS_KEY_ID=${ALERT_AWS_ACCESS_KEY_ID}" \
              "AWS_SECRET_ACCESS_KEY=${ALERT_AWS_SECRET_ACCESS_KEY}" \
              "AWS_COST_ALERT_THRESHOLD_USD=${AWS_COST_ALERT_THRESHOLD_USD}" \
              > .env
            # GHCR requires login even for public images. Add repo secret GHCR_PULL_TOKEN (PAT with read:packages).
            if [ -n "${{ secrets.GHCR_PULL_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            fi
            # The VPN egress sidecar (gluetun) starts only when VPN_ENABLED is
            # explicitly "true" -- not merely when credentials are present. This
            # is deliberate: a failing gluetun once crash-looped hard enough to
            # take the whole box offline, so it must be an explicit, deliberate
            # opt-in, and the safe default (flag unset) is "no VPN, box healthy".
            # Turn it on only after confirming the tunnel connects.
            COMPOSE_PROFILES=""
            if [ "${VPN_ENABLED}" = "true" ]; then COMPOSE_PROFILES="--profile vpn"; fi
            docker compose -f docker-compose.prod.yml ${COMPOSE_PROFILES} pull
            docker compose -f docker-compose.prod.yml ${COMPOSE_PROFILES} up -d --remove-orphans
            # Old :latest becomes untagged (<none>) after each pull — prune frees disk (layers still shared).
            docker image prune -f
