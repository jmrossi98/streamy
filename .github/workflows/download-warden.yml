name: download warden

# Recovery for stuck downloads, on a schedule.
#
# Streamy already knew how to rescue a stalled transfer and how to resume an
# ordered season search. What it lacked was anything that ran them when nobody
# was looking: both were kicked only by a page render, and both are allowed to
# stop part-way and wait for "the next pass". This is the next pass.
#
# Every 10 minutes. Downloads move on the order of tens of minutes, so this is
# frequent enough that a stall is measured in minutes rather than hours, and
# infrequent enough to be nowhere near the indexer rate limits.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# A slow pass should never stack up behind itself.
concurrency:
  group: download-warden
  cancel-in-progress: false

jobs:
  warden:
    runs-on: ubuntu-latest
    steps:
      - name: Run a recovery pass
        env:
          SECRET: ${{ secrets.DOWNLOAD_WARDEN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET}" ]; then
            echo "::error::DOWNLOAD_WARDEN_SECRET is not set"
            exit 1
          fi
          code=$(curl -sS -o report.json -w '%{http_code}' -m 290 -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            https://streamy-app.com/api/cron/download-warden)
          echo "HTTP ${code}"
          cat report.json
          echo
          test "${code}" = "200"

      - name: Fail if the queue has stopped moving
        run: |
          set -euo pipefail
          # jq rather than an inline python heredoc: a multi-line script inside
          # a YAML block scalar has to stay indented, and the first version put
          # its code at column 0, which ended the scalar and made the whole
          # workflow file unparseable. GitHub reported that as a failed run with
          # no logs, on every push.
          jq -r '"queue=\(.queueAfter.total) oldest=\(.queueAfter.oldestWaitMinutes)m series=\(.queueAfter.series) retrying=\(.queueAfter.retrying) healed=\(.healed | length) errors=\(.errors | length)"' report.json
          jq -e '.errors | length == 0' report.json > /dev/null || {
            echo "::warning::The pass reported step errors:"
            jq -r '.errors[] | "  \(.step): \(.error)"' report.json
          }
          # The pass succeeding and the queue being healthy are different
          # facts. This is the alert: a red run means something has been
          # waiting long enough that the automatic recovery did not work,
          # which is exactly the case that used to go unnoticed for hours.
          if [ "$(jq -r '.stuck' report.json)" = "true" ]; then
            echo "::error::Episode search queue has stopped moving; see the report above"
            exit 1
          fi
