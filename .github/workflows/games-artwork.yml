# Gives every library game a default cover/banner/logo/icon automatically,
# so the Games grid shows real art instead of the generic placeholder without
# anyone clicking through the picker for each one -- see
# src/lib/gameArtworkAuto.ts for the matching approach and why it's safe
# (never touches a kind that already has a row, manual or auto).
#
# Hourly is enough: a newly-downloaded game sitting on the placeholder for up
# to an hour is a fine tradeoff against the cost of running this more often,
# and the endpoint is cheap on every run after a game's first pass anyway
# (one DB read, no SGDB calls, once all four kinds are filled).

name: Games Artwork Auto-Fill

on:
  schedule:
    - cron: "23 * * * *" # hourly, off the exact hour so it doesn't stack with other crons
  workflow_dispatch:

concurrency:
  group: games-artwork
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the auto-fill
        env:
          BASE_URL: ${{ secrets.NEXTAUTH_URL }}
          CRON_SECRET: ${{ secrets.GAMES_ARTWORK_CRON_SECRET }}
        run: |
          set -euo pipefail

          # Strip whitespace, including a trailing newline, from anything that
          # goes into the URL.
          #
          # A secret set with `echo` rather than `printf` carries a newline, and
          # GitHub stores it verbatim. curl then rejects the whole URL with
          # "(3) Malformed input to a URL function" and names neither the
          # variable nor the character -- the health probes failed this way for
          # three scheduled runs, and because the request never arrived, nothing
          # was recorded and the admin panel showed no runs at all rather than
          # failing ones.
          BASE_URL="$(printf %s "${BASE_URL}" | tr -d "[:space:]")"
          CRON_SECRET="$(printf %s "${CRON_SECRET}" | tr -d "[:space:]")"

          if [ -z "${CRON_SECRET}" ]; then
            echo "GAMES_ARTWORK_CRON_SECRET is not set -- the endpoint fails closed, so this would 401."
            exit 1
          fi

          curl --silent --show-error --fail-with-body \
            --max-time 280 \
            -X POST \
            "${BASE_URL%/}/api/cron/games-artwork?secret=${CRON_SECRET}" \
          | tee response.json

          echo

          if grep -q '"ok":false' response.json; then
            echo "Endpoint reported an internal failure (see the app logs for detail)."
            exit 1
          fi
